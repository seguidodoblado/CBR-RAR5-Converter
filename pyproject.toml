[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbr-rar5-converter"
version = "0.1.2"
description = "Conversión segura de cómics CBR RAR4 a RAR5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
cbr-rar5-converter = "cbr_rar5_converter.__main__:main"
[tool.setuptools.packages.find]
include = ["cbr_rar5_converter*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
